<footer class="site-footer">
    <div class="wrapper site-footer__grid">
        <div>
            <p class="site-footer__name">{{siteName}}</p>
            <p class="site-footer__tagline">Shopify Plus transformation, enterprise architecture and AI in commerce delivery.</p>
        </div>
        <nav class="site-footer__nav" aria-label="Footer">
            {{nav}}
            <a class="nav__link" href="{{ctaHref}}"{{ctaCurrent}}>{{ctaLabel}}</a>
        </nav>
        <div class="site-footer__contact">
            <a href="mailto:{{email}}">{{email}}</a>
            <a href="{{linkedin}}" rel="noopener">LinkedIn</a>
            <span>{{location}}</span>
        </div>
    </div>
    <div class="wrapper site-footer__bottom">
        <p>© {{year}} {{siteName}}</p>
    </div>
</footer>
