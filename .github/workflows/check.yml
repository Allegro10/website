# Runs the site build in check mode: fails if any page or docs/SITE.md is stale,
# or if any page or Markdown file links to a local file that doesn't exist.
name: Check site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
